<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Pengumpulan Tugas — Teknik Informatika UNPER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Menghubungkan ke file style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center p-4 sm:p-6">

    <!-- Kartu Utama -->
    <div class="w-full max-w-xl barca-card animate-card">
        <div class="blaugrana-bar"></div>

        <div class="card-content p-5 sm:p-8">
            <!-- Header -->
            <div class="border-b border-white/15 pb-5 mb-6">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <span class="inline-flex items-center gap-2 text-[11px] sm:text-xs font-bold tracking-wider uppercase text-amber-300 bg-amber-400/15 border border-amber-400/35 px-3 py-1 rounded-full">
                        <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                        Informatika • UNPER
                    </span>
                    <span class="text-xs font-semibold text-slate-200/90 tracking-wide">
                        Més que un club
                    </span>
                </div>

                <h1 class="text-2xl sm:text-3xl font-extrabold mt-3.5 text-white drop-shadow-md">
                    Web <span class="text-amber-400">Pengumpulan Tugas</span>
                </h1>
                <p class="text-slate-200 text-xs sm:text-sm mt-1.5 leading-relaxed drop-shadow">
                    Silakan lengkapi identitas dan unggah file tugas Anda di bawah ini.
                </p>
            </div>

            <!-- Area Notifikasi Dinamis -->
            <div id="alert-box" class="hidden mb-5 p-4 rounded-xl text-xs sm:text-sm border backdrop-blur-md"></div>

            <!-- Form Pengumpulan -->
            <form id="form-tugas" class="space-y-4 sm:space-y-5">
                
                <!-- Nama & NIM -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="nama_mahasiswa" class="block text-xs font-bold uppercase tracking-wider text-amber-300 mb-1.5 drop-shadow">
                            Nama Lengkap *
                        </label>
                        <input type="text" id="nama_mahasiswa" name="nama_mahasiswa" required autocomplete="off"
                            class="w-full px-4 py-3 rounded-xl barca-input">
                    </div>
                    <div>
                        <label for="nim" class="block text-xs font-bold uppercase tracking-wider text-amber-300 mb-1.5 drop-shadow">
                            NIM *
                        </label>
                        <input type="text" id="nim" name="nim" required inputmode="numeric" autocomplete="off"
                            class="w-full px-4 py-3 rounded-xl barca-input">
                    </div>
                </div>

                <!-- Kelas & Mata Kuliah -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="sm:col-span-1">
                        <label for="kelas" class="block text-xs font-bold uppercase tracking-wider text-amber-300 mb-1.5 drop-shadow">
                            Kelas *
                        </label>
                        <select id="kelas" name="kelas" required
                            class="w-full px-3.5 py-3 rounded-xl barca-input cursor-pointer">
                            <option value="">-- Pilih --</option>
                            <option value="A">Kelas A</option>
                            <option value="B">Kelas B</option>
                            <option value="C">Kelas C</option>
                            <option value="D">Kelas D</option>
                        </select>
                    </div>

                    <div class="sm:col-span-2">
                        <label for="mata_kuliah" class="block text-xs font-bold uppercase tracking-wider text-amber-300 mb-1.5 drop-shadow">
                            Mata Kuliah *
                        </label>
                        <select id="mata_kuliah" name="mata_kuliah" required
                            class="w-full px-3.5 py-3 rounded-xl barca-input cursor-pointer">
                            <option value="">-- Pilih Mata Kuliah --</option>
                            <option value="Praktikum Pemrograman Web">Praktikum Pemrograman Web</option>
                            <option value="Sistem Operasi">Sistem Operasi</option>
                            <option value="Kecerdasan Buatan">Kecerdasan Buatan</option>
                            <option value="Praktikum Basis Data">Praktikum Basis Data</option>
                            <option value="Pemrograman Web">Pemrograman Web</option>
                            <option value="Basis Data">Basis Data</option>
                            <option value="Rekayasa Perangkat Lunak">Rekayasa Perangkat Lunak</option>
                            <option value="Statistika">Statistika</option>
                            <option value="Matematika Diskrit">Matematika Diskrit</option>
                            <option value="Aljabar Linier dan Matriks">Aljabar Linier dan Matriks</option>
                        </select>
                    </div>
                </div>

                <!-- Upload File -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-amber-300 mb-1.5 drop-shadow">
                        File Tugas * <span class="normal-case font-normal text-slate-300">(Maks. 20MB)</span>
                    </label>
                    <label for="file_tugas" id="drop-zone" class="drop-zone flex flex-col items-center justify-center w-full p-5 sm:p-6 rounded-2xl cursor-pointer text-center group">
                        <div class="w-11 h-11 rounded-full bg-amber-400/15 border border-amber-400/35 flex items-center justify-center mb-2.5 group-hover:scale-110 transition-transform duration-300">
                            <svg class="w-5 h-5 text-amber-300" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                            </svg>
                        </div>
                        <p id="file-label-title" class="text-xs sm:text-sm font-semibold text-white group-hover:text-amber-300 transition-colors break-all px-2">
                            Tap atau seret file tugas ke sini
                        </p>
                        <p id="file-label-sub" class="text-[11px] sm:text-xs text-slate-300 mt-1">
                            PDF, DOCX, ZIP, RAR, HTML, PHP, SQL, TXT, JPG, PNG
                        </p>
                        <input type="file" name="file_tugas" id="file_tugas" required
                            accept=".pdf,.doc,.docx,.zip,.rar,.html,.php,.sql,.txt,.jpg,.jpeg,.png,.webp" class="hidden">
                    </label>
                </div>

                <!-- Catatan Tambahan -->
                <div>
                    <label for="catatan" class="block text-xs font-bold uppercase tracking-wider text-amber-300 mb-1.5 drop-shadow">
                        Catatan Tambahan <span class="normal-case font-normal text-slate-300">(Opsional)</span>
                    </label>
                    <textarea id="catatan" name="catatan" rows="2"
                        class="w-full px-4 py-2.5 rounded-xl barca-input"></textarea>
                </div>

                <!-- Tombol Kirim -->
                <button type="submit" id="btn-submit"
                    class="w-full py-3.5 px-6 rounded-xl text-white font-bold text-sm sm:text-base tracking-wide btn-blaugrana flex items-center justify-center gap-2 cursor-pointer shadow-lg">
                    <span id="btn-text">Kirim Tugas Sekarang</span>
                    <svg class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                    </svg>
                </button>
            </form>

            <!-- Footer -->
            <footer class="mt-6 pt-5 border-t border-white/15 text-center">
                <p class="text-xs sm:text-sm font-semibold text-white">
                    &copy; 2026 <span class="text-amber-400">Ifan Julian Pratama</span>
                </p>
                <p class="text-[11px] sm:text-xs text-slate-300 mt-1">
                    NIM: 2503010070 &bull; Kelas C &bull; Informatika UNPER
                </p>
                <div class="mt-2.5 flex items-center justify-center gap-3 text-[11px] text-slate-300/90">
                    <a href="https://github.com/ifanjulianpratama" target="_blank" rel="noopener noreferrer" class="hover:text-amber-300 transition-colors">
                        GitHub
                    </a>
                    <span>&bull;</span>
                    <a href="mailto:ifan.julian@student.unper.ac.id" class="hover:text-amber-300 transition-colors">
                        Email Kampus
                    </a>
                </div>
            </footer>
        </div>
    </div>

    <!-- Menghubungkan ke file script.js -->
    <script src="script.js"></script>
</body>
</html>
